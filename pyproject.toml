[project]
name = "precedenz"
version = "0.1.0"
description = "Teach the agent once; it safely handles the next hundred decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "strands-agents==1.54.0",
    # Strands OpenAIResponsesModel, used by the mubit provider.
    "openai==2.54.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "boto3==1.43.88",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "psycopg[binary,pool]==3.3.5",
]
postgres = [
    "psycopg[binary,pool]==3.3.5",
]

[project.scripts]
precedenz = "precedenz_client.cli:main"
precedenz-mcp = "precedenz_client.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "precedenz_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: opt-in tests that call a live model provider (deselected by default)",
]
asyncio_mode = "auto"
